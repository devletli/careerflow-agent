<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: invisible badge only (not a blocker)</title></head>
<body>
  <h1>Apply: DevOps Engineer</h1>
  <form id="application-form" onsubmit="window.__submitted = true; return false;">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <button type="submit" id="submit-btn">Submit application</button>
  </form>
  <!-- Invisible reCAPTCHA badge in the page corner: must NOT block. -->
  <div class="grecaptcha-badge" style="position:fixed;right:0;bottom:0;width:70px;height:20px;">
    <iframe src="/__mock__/recaptcha/api2/anchor" width="70" height="20" title="recaptcha badge"></iframe>
  </div>
  <script>window.__submitted = false;</script>
</body>
</html>
