<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: form with custom questions</title></head>
<body>
  <h1>Apply: DevOps Engineer</h1>
  <form id="application-form" onsubmit="window.__submitted = true; return false;">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="work_authorization">Are you authorized to work in Germany?</label>
    <select id="work_authorization" name="work_authorization" required>
      <option value="">Please choose</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
    <label for="salary_expectation">Salary expectation (annual gross, EUR)</label>
    <input type="text" id="salary_expectation" name="salary_expectation">
    <label for="anything_else">Is there anything else you would like to tell us?</label>
    <textarea id="anything_else" name="anything_else"></textarea>
    <button type="submit" id="submit-btn">Submit application</button>
  </form>
  <script>window.__submitted = false;</script>
</body>
</html>
