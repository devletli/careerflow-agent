services:

  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobagent}
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobagent} -d ${POSTGRES_DB:-jobagent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-db:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.init_db"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ./profile:/app/profile:ro
      - ./artifacts:/app/artifacts

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  job-discovery:
    build:
      context: .
      dockerfile: services/job-discovery/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  job-matching:
    build:
      context: .
      dockerfile: services/job-matching/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  cv-generator:
    build:
      context: .
      dockerfile: services/cv-generator/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./profile:/app/profile:ro
      - ./artifacts:/app/artifacts

  application-analyzer:
    build:
      context: .
      dockerfile: services/application-analyzer/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  browser-agent:
    build:
      context: .
      dockerfile: services/browser-agent/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./profile:/app/profile:ro
      - ./artifacts:/app/artifacts
      - browser_state:/app/browser-state
      - browser_traces:/app/browser-traces

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      API_INTERNAL_URL: http://api:8000
      API_KEY: ${API_KEY:?set API_KEY in .env}
      NEXT_PUBLIC_LOCALE: ${DASHBOARD_LOCALE:-en}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  browser_state:
  browser_traces:
