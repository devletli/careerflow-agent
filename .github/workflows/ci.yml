name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared pytest pytest-asyncio aiosqlite pytest-playwright ruff mypy httpx beautifulsoup4 playwright

      - name: Install Chromium for browser regression tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Type-check shared contracts
        run: mypy shared/

      - name: Backend tests (unit + integration + matching eval, live excluded)
        run: python -m pytest -m "not live" -q

      - name: Validate Docker Compose configuration
        run: cp .env.example .env && docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
