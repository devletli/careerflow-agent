name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared pytest pytest-asyncio aiosqlite pytest-playwright ruff mypy httpx beautifulsoup4 playwright

      - name: Install Chromium for browser regression tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Type-check shared contracts
        run: mypy shared/

      - name: Type-check API
        run: mypy services/api/app

      - name: Backend tests (unit + integration + matching eval, live excluded)
        run: python -m pytest -m "not live" -q

      - name: Validate Docker Compose configuration
        # .env.example bilerek bos sir icerir; :?set korumalarini dogrulamak icin
        # shell ortamindan dummy degerler verilir (.env dosyasindaki bos degerleri ezer).
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci_dummy_password \
          MINIO_ACCESS_KEY=ci_dummy_user \
          MINIO_SECRET_KEY=ci_dummy_secret_12345678 \
          API_KEY=ci_dummy_api_key_1234567890 \
          docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
